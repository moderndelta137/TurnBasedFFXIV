<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Co-op Positioning RPG Prototype</title>
<style>
  :root{
    --bg0:#061121;
    --bg1:#0a1c3a;
    --panel:#102a52ee;
    --panel2:#173b71ee;
    --line:#6eb8ff;
    --gold:#ffd76a;
    --red:#ff5c6c;
    --green:#4df2a0;
    --blue:#61c8ff;
    --purple:#bf8cff;
    --text:#eef8ff;
    --muted:#95b9df;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%; margin:0; background:#020711; color:var(--text); font-family: system-ui, -apple-system, Segoe UI, sans-serif; overflow:hidden;}
  body{display:flex; justify-content:center; align-items:center;}
  #game{
    width:min(100vw, 430px);
    height:100dvh;
    max-height:932px;
    background:linear-gradient(#07182c,#06152d 42%,#03101f);
    border-left:1px solid #16355f;
    border-right:1px solid #16355f;
    position:relative;
    overflow:hidden;
  }
  .topbar{
    height:38px; padding:5px 9px; display:flex; align-items:center; justify-content:space-between;
    background:linear-gradient(180deg,#16457d,#09234b);
    border-bottom:2px solid #84d9ff;
    box-shadow:0 0 18px #1c7cff88 inset;
    font-weight:800; font-size:12px; letter-spacing:.3px;
  }
  .topbar-right{display:flex; align-items:center; gap:6px;}
  .pill{padding:3px 8px; border:1px solid #8dd8ff; border-radius:999px; background:#071832aa; box-shadow:0 0 9px #55bfff55 inset;}
  .option-btn{border:1px solid #ffd76a; border-radius:8px; background:linear-gradient(#75550b,#3a2704); color:#fff0a4; height:26px; min-width:42px; font-size:11px; font-weight:1000; box-shadow:0 0 8px #ffd76a55;}
  .battle{
    height:62%; min-height:455px; position:relative; overflow:hidden;
    background:
      radial-gradient(circle at 55% 25%, #4ab5ff33 0 12%, transparent 34%),
      linear-gradient(180deg,#102848,#07172d 70%,#071427);
  }
  .battle:before{
    content:""; position:absolute; inset:0; opacity:.62;
    background-image:
      linear-gradient(#7fd7ff44 1px, transparent 1px),
      linear-gradient(90deg,#7fd7ff44 1px, transparent 1px);
    background-size:46px 46px;
    transform:perspective(280px) rotateX(54deg) translateY(-75px) scale(1.25);
    transform-origin:top center;
    filter:drop-shadow(0 0 5px #6fcaff);
  }
  .boss-status{
    position:absolute; left:50%; top:8px; z-index:6; transform:translateX(-50%);
    width:min(390px,calc(100% - 28px)); padding:5px 8px 7px;
    border:0; border-radius:0; background:transparent;
    box-shadow:none;
  }
  .boss-status-row{display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:11px; font-weight:1000; color:#ff7181; letter-spacing:.5px; text-transform:uppercase;}
  .boss-hp-number{color:#d7e8ff; font-size:9px;}
  .boss-hp-large{height:9px; margin-top:5px; border:1px solid #ff8bb1; border-radius:999px; background:#240712; overflow:hidden;}
  .boss-hp-large span{display:block; height:100%; background:linear-gradient(90deg,#ff344e,#ff54a8);}
  .intent{
    position:absolute; left:50%; top:52px; z-index:12; transform:translateX(-50%);
    min-width:210px; max-width:340px; text-align:center;
    background:linear-gradient(180deg,#153762ee,#0b1b35ee);
    border:1px solid #65caff; border-radius:8px; padding:7px 12px 10px;
    box-shadow:inset 0 0 10px #57bfff33,0 4px 0 #0007;
  }
  .intent-title{font-size:16px; font-weight:1000; color:#fff2aa; letter-spacing:.7px; text-shadow:0 2px #00124d;}
  .intent-sub{display:none;}
  .intent-bar{position:absolute; left:10px; right:10px; bottom:4px; height:4px; border:1px solid #91dfff; border-radius:99px; overflow:hidden; background:#06101e;}
  .intent-bar span{display:block; height:100%; width:0%; background:linear-gradient(90deg,#61c8ff,#ffd76a); transition:width 1s linear;}
  .danger{font-size:11px; padding:3px 7px; border-radius:999px; border:1px solid #fff; font-weight:900;}
  .danger.High{color:#fff; background:#b1223a; border-color:#ff98a5}.danger.Med{color:#08131e; background:#ffd76a}.danger.Low{color:#07131c; background:#6fffc0}
  .intent .danger{display:none;}
  .grid-wrap{position:absolute; inset:80px 18px 62px 18px; display:flex; justify-content:center; align-items:center; z-index:2;}
  .grid{
    width:min(92vw,380px); height:min(92vw,380px); max-height:360px; max-width:380px;
    display:grid; grid-template-columns:repeat(4,1fr); grid-template-rows:repeat(4,1fr);
    gap:3px; transform:perspective(420px) rotateX(15deg); position:relative;
  }
  .cell{
    border:1px solid #74cbff88; border-radius:6px; background:linear-gradient(135deg,#12345e99,#0d203dcc);
    box-shadow:inset 0 0 13px #60caff44, 0 0 6px #56bfff22; position:relative;
  }
  .cell.enemy-cell{background:linear-gradient(135deg,#32254c,#120d20); border-color:#b68cff88; box-shadow:inset 0 0 14px #bc6bff55;}
  .cell.valid{animation:pulse 1s infinite; border-color:#70ffcc; cursor:pointer;}
  .cell.valid::after{
    content:""; position:absolute; inset:-3px; border:2px solid #70ffcc; border-radius:8px;
    box-shadow:0 0 8px #70ffcc, inset 0 0 8px #70ffcc55; pointer-events:none;
    animation:moveBorder 1s infinite;
  }
  .cell.valid.warn::after{border-width:3px; box-shadow:0 0 10px #70ffcc, 0 0 2px #001b12, inset 0 0 10px #70ffcc66;}
  .cell.warn{animation:warn .55s infinite alternate; border-color:#ffea77; background:linear-gradient(135deg,#8d3b1dcc,#3a1111cc);}
  .cell.hazard{border-color:#ff783d; background:linear-gradient(135deg,#8d2b10dd,#2d0704dd); box-shadow:inset 0 0 16px #ff6a2a77,0 0 10px #ff3b1f44;}
  .cell.tower{border-color:#9ee8ff; background:linear-gradient(135deg,#2458aadd,#08183edd); box-shadow:inset 0 0 18px #7be8ff88,0 0 12px #7be8ff66;}
  .cell.tower::before{content:"T"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:1000; color:#eaffff; text-shadow:0 2px #00124d;}
  .cell.selected-dest{outline:2px solid #fff; box-shadow:0 0 14px #fff, inset 0 0 16px #b7f6ff;}
  @keyframes pulse{0%,100%{box-shadow:0 0 4px #5dffd8, inset 0 0 12px #60caff44}50%{box-shadow:0 0 16px #5dffd8, inset 0 0 18px #5dffd877}}
  @keyframes moveBorder{0%,100%{opacity:.72}50%{opacity:1}}
  @keyframes warn{from{filter:brightness(1)}to{filter:brightness(1.6); box-shadow:0 0 20px #ff5c4d}}
  .enemy-sprite{
    position:absolute; left:50%; top:52%; width:94px; height:120px; transform:translate(-50%,-100%); z-index:7;
    filter:drop-shadow(0 12px 4px #0009); pointer-events:none;
  }
  .enemy-art{position:absolute; left:50%; top:50%; width:100%; height:calc(100% - 22px); transform:translate(-50%,-50%); display:flex; align-items:center; justify-content:center;}
  .enemy-sprite-img{width:100%; height:100%; object-fit:contain; image-rendering:pixelated; display:block;}
  .enemy-label{position:absolute; left:0; right:0; bottom:10px; text-align:center; font-size:10px; font-weight:900; color:#ffe797; text-shadow:0 1px #000;}
  .enemy-hp{position:absolute; left:50%; bottom:0; transform:translateX(-50%); width:min(116px,70%); height:7px; border:1px solid #ffb1b1; background:#210a12; border-radius:8px; overflow:hidden;}
  .enemy-hp span{display:block; height:100%; background:linear-gradient(90deg,#ff3d4d,#ffb04d);}
  .token{
    position:absolute; width:51px; height:57px; z-index:10; transform:translate(-50%,-50%);
    transition:left .22s ease, top .22s ease; filter:drop-shadow(0 5px 3px #0008); pointer-events:none;
  }
  #game.victory-walk .token{transition:transform .7s ease-in; transform:translate(-250px,-50%);}
  #game.battle-enter .token{animation:partyEnter .7s ease-out both;}
  #game.battle-enter .enemy-sprite{animation:enemyEnter .7s ease-out both;}
  @keyframes partyEnter{from{transform:translate(190px,-50%)}to{transform:translate(-50%,-50%)}}
  @keyframes enemyEnter{from{transform:translate(-230%,-100%)}to{transform:translate(-50%,-100%)}}
  .token .sprite{width:51px; height:57px; position:relative; image-rendering:pixelated;}
  .sprite-img{width:100%; height:100%; object-fit:contain; image-rendering:pixelated; display:block;}
  .sprite:before{content:""; position:absolute; left:9px; top:4px; width:16px; height:13px; border-radius:45%; background:var(--c); border:2px solid #fff8;}
  .sprite:after{content:""; position:absolute; left:7px; top:17px; width:20px; height:15px; background:var(--c2); border:2px solid #fff8; clip-path:polygon(18% 0,82% 0,100% 100%,0 100%);}
  .token.back .sprite-img{transform:scaleX(-1)}
  .token.active{filter:drop-shadow(0 0 8px #fff) drop-shadow(0 5px 3px #0008)}
  .mini-hp{position:absolute; left:0; top:57px; width:50px; height:5px; border:1px solid #bbdfff; background:#142; border-radius:6px; overflow:hidden;}
  .mini-hp span{display:block;height:100%;background:#55ff93;}
  .tag{position:absolute; left:-3px; top:-13px; font-size:10px; font-weight:900; color:#fff; text-shadow:0 1px 2px #000; width:56px; text-align:center;}
  .float{position:absolute; z-index:99; font-weight:1000; font-size:18px; pointer-events:none; animation:float 1s ease forwards; text-shadow:0 2px 2px #000;}
  .float.choice{color:#fff3a8; font-size:13px; text-shadow:0 0 8px #49dfff,0 2px 2px #000;}
  @keyframes float{to{transform:translateY(-42px); opacity:0}}
  .command{
    position:absolute; left:0; right:0; bottom:0; height:38%; min-height:300px;
    background:linear-gradient(180deg,#0b2347,#061226); border-top:2px solid #79d9ff;
    box-shadow:0 -8px 22px #3ca4ff33; padding:6px 8px 7px; z-index:20;
    display:flex; flex-direction:column; gap:4px;
  }
  .hintline{display:none;}
  .timer-pill{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:14;
    width:70px; height:70px; display:flex; align-items:center; justify-content:center;
    border:2px solid #64e8ff; border-radius:50%; background:#031832dd; color:#8df3ff;
    font-size:26px; font-weight:1000; box-shadow:0 0 18px #40dfff99, inset 0 0 14px #35caff66;
    text-shadow:0 0 8px #4eefff;
  }
  .timer-pill.danger{border-color:#ffd76a; color:#fff2a8; box-shadow:0 0 18px #ffd76a99, inset 0 0 14px #ffb00066;}
  .resolve{border:1px solid #ffd76a; background:linear-gradient(#75550b,#3a2704); color:#fff0a4; border-radius:9px; padding:4px 9px; font-weight:1000; box-shadow:0 0 10px #ffd76a55;}
  .resolve:disabled{opacity:.35; filter:grayscale(1)}
  .panels{display:grid; grid-template-rows:repeat(4,1fr); gap:4px; flex:1; min-height:0;}
  .panel{
    display:grid; grid-template-columns:44px 1fr; grid-template-rows:auto 1fr; gap:1px 5px;
    border:1px solid #65caff; border-radius:8px; background:linear-gradient(180deg,#153762ee,#0b1b35ee); padding:4px; position:relative;
    box-shadow:inset 0 0 10px #57bfff33;
  }
  .panel.sel{border-color:#fff; box-shadow:0 0 10px #fff8, inset 0 0 10px #57bfff66;}
  .jobbox{grid-row:1/3; width:38px; height:38px; align-self:center; display:flex; align-items:center; justify-content:center; border-radius:7px; border:1px solid #c4eeff; background:#061b38; font-weight:1000; font-size:11px; color:#fff4aa;}
  .jobbox.tank{background:#061b4d;border-color:#5aa8ff;color:#a9d8ff}.jobbox.healer{background:#06381f;border-color:#65ffb8;color:#b8ffe4}.jobbox.ranged,.jobbox.melee{background:#4a0714;border-color:#ff6e85;color:#ffd0d7}
  .name{font-size:11px; font-weight:900; display:flex; justify-content:space-between; align-items:center; gap:5px; line-height:1.1; min-width:0;}
  .name-left{display:flex; align-items:center; gap:4px; min-width:0;}
  .char-name{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .effect-icons{display:flex; align-items:center; gap:2px; min-width:0; max-width:96px; overflow:hidden;}
  .effect-icon{
    --effect-color:#70ffcc; --fill:100;
    width:15px; height:15px; flex:0 0 15px; border:1px solid var(--effect-color); border-radius:3px;
    display:flex; align-items:center; justify-content:center; color:#06101e; font-size:9px; font-weight:1000; line-height:1;
    background:conic-gradient(var(--effect-color) calc(var(--fill)*1%), #06101e 0);
    box-shadow:0 0 5px color-mix(in srgb, var(--effect-color) 70%, transparent);
  }
  .effect-icon.passive{color:var(--effect-color); background:#06101e;}
  .effect-icon.down{color:#ffd7d7;}
  .moveinfo{color:#9ee8ff; font-size:9px; font-weight:700; max-width:132px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .bars{display:grid; grid-template-columns:1fr 1fr; gap:4px; margin:1px 0;}
  .barline{font-size:8px; color:#d6edff; display:grid; grid-template-columns:20px 1fr; align-items:center; gap:3px;}
  .bar{height:6px; border:1px solid #8ed8ff; background:#06101e; border-radius:8px; overflow:hidden;}.bar span{display:block;height:100%;}.hpbar span{background:#59ef91}.mpbar span{background:#5fc6ff}.tpbar span{background:#ffd55d}
  .actions{display:grid; grid-template-columns:repeat(4,1fr); gap:3px;}
  .act{
    min-width:0; border:1px solid #78caff; background:linear-gradient(#174f88,#0c2c54); color:#eaf8ff; border-radius:6px;
    font-size:9px; line-height:1; padding:3px 3px; font-weight:900; position:relative; overflow:hidden;
    display:grid; grid-template-columns:14px minmax(0,1fr) auto; grid-template-rows:auto auto; gap:1px 3px; align-items:center;
  }
  .act-icon{flex:0 0 auto; width:14px; height:14px; text-align:center; font-size:11px; display:flex; align-items:center; justify-content:center;}
  .act-icon img{width:14px; height:14px; object-fit:cover; border-radius:3px; box-shadow:0 0 3px #000;}
  .act-name{flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:left;}
  .act-cost{flex:0 0 auto; color:#ffd76a; font-size:7px;}
  .act-speed{grid-column:2/4; color:#9ee8ff; font-size:7px; text-align:left;}
  .act.selected{border-color:#ffd76a; color:#fff6b3; box-shadow:0 0 10px #ffd76a88;}
  .act.disabled{opacity:.45; filter:grayscale(1);}
  .act.ai-lock{cursor:default; opacity:1; filter:none;}
  .act.ai-lock:not(.selected){opacity:.58; filter:saturate(.75);}
  .act.ai-lock.selected{border-color:#ffd76a; color:#fff6b3; box-shadow:0 0 10px #ffd76a88, inset 0 0 8px #ffd76a44;}
  .act.fast{box-shadow:inset 0 0 8px #60ffb855}.act.slow{box-shadow:inset 0 0 8px #b56cff66}
  .stamps{display:flex; gap:5px; overflow-x:auto; padding-top:2px;}
  .stamp{flex:0 0 auto; border:1px solid #91dfff; background:#0d2a51; color:#dff7ff; border-radius:999px; padding:4px 8px; font-size:10px; font-weight:900;}
  .log{
    position:absolute; left:10px; right:10px; bottom:calc(38% + 8px); z-index:30; max-height:70px; overflow:hidden;
    display:flex; flex-direction:column; gap:3px; pointer-events:none;
  }
  .log div{font-size:10px; padding:3px 7px; background:#031225d9; border-left:3px solid #83d9ff; border-radius:6px; color:#daf2ff;}
  .target-lines{position:absolute; inset:0; z-index:9; pointer-events:none; overflow:visible;}
  .target-line{fill:none; stroke:#75e8ff; stroke-width:3; stroke-linecap:round; filter:drop-shadow(0 0 5px #46dfff);}
  .target-line.ai{stroke:#75e8ff; opacity:.74;}
  .target-line.heal{stroke:#65ffb8;}
  .target-line.enemy-target{stroke:#ff5c6c; opacity:.95; filter:drop-shadow(0 0 5px #ff5c6c);}
  .target-dot{fill:#f8ffff; filter:drop-shadow(0 0 5px currentColor);}
  #game.enemy-defeated .boss-status,
  #game.enemy-defeated .intent,
  #game.enemy-defeated .enemy-sprite,
  #game.enemy-defeated .target-lines{display:none;}
  .action-tooltip{
    position:absolute; left:0; top:0; z-index:95;
    width:220px; display:none; pointer-events:none;
    background:linear-gradient(180deg,#153762fa,#0b1b35fa);
    border:1px solid #65caff; border-radius:8px; padding:7px 9px;
    box-shadow:inset 0 0 10px #57bfff33,0 4px 0 #0008;
    color:#dff7ff; font-size:10px; line-height:1.28;
  }
  .action-tooltip b{display:block; color:#fff2a8; font-size:12px; margin-bottom:2px;}
  .result-window{
    position:absolute; left:50%; top:86px; z-index:70; transform:translateX(-50%);
    width:min(360px,calc(100% - 28px)); display:none;
    background:linear-gradient(180deg,#153762fa,#0b1b35fa);
    border:1px solid #65caff; border-radius:8px; padding:10px 12px;
    box-shadow:inset 0 0 10px #57bfff33,0 4px 0 #0008;
    color:#dff7ff; font-size:12px; font-weight:900;
  }
  .result-window b{display:block;color:#fff2a8;font-size:15px;margin-bottom:5px;}
  .screen-wipe{position:absolute; inset:0; z-index:100; pointer-events:none; display:none; background:#000;}
  #game.wipe-out .screen-wipe{display:block; animation:wipeOut .65s ease-in forwards;}
  #game.wipe-in .screen-wipe{display:block; animation:wipeIn .65s ease-out forwards;}
  @keyframes wipeOut{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
  @keyframes wipeIn{from{clip-path:inset(0 0 0 0)}to{clip-path:inset(0 0 0 100%)}}
  .overlay{position:absolute; inset:0; z-index:80; background:#020711d9; display:none; align-items:center; justify-content:center; padding:24px;}
  .modal{width:100%; max-width:360px; border:2px solid #ffd76a; background:linear-gradient(#123c68,#071429); border-radius:16px; padding:18px; box-shadow:0 0 25px #ffd76a55; text-align:center;}
  .modal h2{margin:0 0 8px; color:#fff1a8}.modal p{font-size:13px;color:#d8edff}.modal button{margin:5px; border:1px solid #91dfff; border-radius:10px; background:#103a6a; color:white; padding:9px 12px; font-weight:900;}
  .option-row{display:grid; grid-template-columns:86px 1fr 42px; gap:8px; align-items:center; margin:12px 0; color:#dff7ff; font-size:12px; font-weight:900; text-align:left;}
  .option-row input{width:100%; accent-color:#ffd76a;}
  .danger-btn{border-color:#ff98a5!important; background:linear-gradient(#8b1d31,#3a0712)!important; color:#ffe4e8!important;}
  #game.lobby-mode > .topbar,
  #game.lobby-mode > .battle,
  #game.lobby-mode > .command,
  #game.lobby-mode > .log{display:none;}
  #game.battle-mode .lobby{display:none;}
  .lobby{
    position:absolute; inset:0; z-index:60; overflow:hidden;
    background:
      radial-gradient(circle at 50% 22%, #67d8ff66 0 8%, transparent 28%),
      linear-gradient(180deg,#0e3472 0%,#061947 42%,#020817 100%);
  }
  .lobby:before{
    content:""; position:absolute; inset:92px 0 202px; opacity:.82;
    background:
      linear-gradient(90deg,#03112c 0 7%, transparent 16% 84%, #03112c 93%),
      radial-gradient(circle at 50% 58%, #5dffff66 0 13%, transparent 28%),
      linear-gradient(180deg,#124b98,#071b44 64%,#03112b);
  }
  .lobby:after{
    content:""; position:absolute; left:50%; top:236px; width:235px; height:235px; transform:translateX(-50%);
    border-radius:50%;
    background:radial-gradient(circle,#9fffff44 0 20%,#29c8ff22 21% 42%,transparent 43%);
    border:2px solid #91f5ff88;
    box-shadow:0 0 24px #5bdcffcc, inset 0 0 25px #3dd8ff99;
  }
  .lobby-top{
    position:absolute; inset:0 0 auto; height:104px; z-index:3;
    background:linear-gradient(180deg,#0e3678,#071b45);
    border-bottom:2px solid #8bdfff;
    box-shadow:0 0 22px #2caeff66 inset;
    padding:10px 14px;
  }
  .lobby-title{
    position:absolute; left:50%; top:48px; transform:translateX(-50%);
    font-size:30px; font-family:Georgia, 'Times New Roman', serif; font-weight:900; letter-spacing:1px;
    text-shadow:0 2px #00112c,0 0 12px #71dfff; white-space:nowrap;
  }
  .crystal-mark{position:absolute; left:50%; top:9px; width:46px; height:46px; transform:translateX(-50%) rotate(45deg); background:linear-gradient(135deg,#eaffff,#49d5ff 45%,#1359e8); border:2px solid #dffbff; box-shadow:0 0 16px #5fdcff;}
  .profile-card,.currency-card{
    position:absolute; top:10px; width:132px; min-height:72px; border:1px solid #8dd8ff; border-radius:10px;
    background:linear-gradient(180deg,#0a2a61dd,#031331dd); box-shadow:inset 0 0 11px #58bdff66;
    padding:8px; font-weight:900;
  }
  .profile-card{left:10px}.currency-card{right:10px; text-align:right}
  .profile-name,.currency-row{font-size:13px}.rank-line,.energy-line{font-size:11px; color:#d8edff; margin-top:5px}
  .expbar,.energybar{height:8px; border:1px solid #91dfff; border-radius:999px; overflow:hidden; background:#05152e; margin-top:5px}
  .expbar span{display:block;height:100%;width:58%;background:linear-gradient(90deg,#7fff8c,#30dfff)}.energybar span{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ffd45c,#fff09a)}
  .party-rail,.side-actions{
    position:absolute; top:150px; bottom:270px; z-index:4; display:flex; flex-direction:column; gap:9px;
  }
  .party-rail{left:8px; width:74px}.side-actions{right:8px; width:74px}
  .rail-box,.side-box{

function parseCsv(text){
  const rows=[]; let row=[], cell='', quoted=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i], next=text[i+1];
    if(ch==='"' && quoted && next==='"'){cell+='"'; i++; continue;}
    if(ch==='"'){quoted=!quoted; continue;}
    if(ch===',' && !quoted){row.push(cell); cell=''; continue;}
    if((ch==='\n'||ch==='\r') && !quoted){
      if(ch==='\r'&&next==='\n') i++;
      row.push(cell); if(row.some(v=>v!=='')) rows.push(row); row=[]; cell=''; continue;
    }
    cell+=ch;
  }
  row.push(cell); if(row.some(v=>v!=='')) rows.push(row);
  const headers=rows.shift()||[];
  return rows.map(r=>Object.fromEntries(headers.map((h,i)=>[h,r[i]??''])));
}
const num=v=>v===''?0:Number(v);
const bool=v=>String(v).toLowerCase()==='true';
async function loadCsv(path){const res=await fetch(path); if(!res.ok) throw new Error(path); return parseCsv(await res.text());}
async function loadOptionalCsv(path){try{return await loadCsv(path)}catch(e){return []}}
function resetObject(target, next){
  Object.keys(target).forEach(k=>delete target[k]);

function actionTargets(p){
  if(!p.selectedAction) return [];
  const a=actions[p.selectedAction];
  if(['physical','magic','magicWeak','interrupt','jump','dot'].includes(a.type)) return [{type:'enemy'}];
  if(a.type==='heal'){
    const t=state.party.filter(x=>x.hp>0).sort((a,b)=>hpPct(a)-hpPct(b))[0];
    return t?[{type:'party', target:t}]:[];
  }
  if(a.type==='healAll') return state.party.filter(x=>x.hp>0).map(t=>({type:'party', target:t}));
  if(a.type==='regen'){
    const t=state.party.filter(x=>x.hp>0).sort((a,b)=>hpPct(a)-hpPct(b))[0];
    return t?[{type:'party', target:t}]:[];
  }
  if(a.type==='shield'){
    const t=p.selectedAction==='protect'?state.party.find(x=>x.id===state.enemy.intent.targetId):p;
    return t?[{type:'party', target:t}]:[];
  }
  if(a.type==='counter') return [{type:'party', target:p}];
  if(a.type==='cleanse') return [{type:'party', target:state.party.find(x=>x.status.length)||p}];
  if(a.type==='tank'){
    if(p.selectedAction==='cover'){
      const t=state.party.find(x=>x.id===state.enemy.intent.targetId);
      return t?[{type:'party', target:t}]:[];
    }
    if(p.selectedAction==='guard_wall') return state.party.filter(x=>x.hp>0).map(t=>({type:'party', target:t}));
    return [{type:'enemy'}];
  }
  return [];
}

function escapeHtml(value){
  return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function effectColor(kind,type=''){
  if(kind==='debuff') return '#ff6e85';
  if(type==='heal'||type==='regen') return '#65ffb8';
  if(type==='shield'||type==='tank'||type==='guard'||type==='survive') return '#5aa8ff';
  if(type==='resource'||type==='cost') return '#ffd76a';
  if(type==='position'||type==='movement'||type==='timing') return '#9ee8ff';
  if(type==='damage'||type==='buff'||type==='risk') return '#ff9a5c';
  return '#70ffcc';
}
function timedEffect(id,name,kind,type,desc,current,max){
  const safeMax=Math.max(1,max||current||1);
  return {id,name,kind,type,desc,fill:Math.max(8,Math.min(100,Math.round((current||safeMax)/safeMax*100))),timed:true,color:effectColor(kind,type)};
}
function characterEffects(p){
  const effects=[];
  (p.passives||[]).filter(Boolean).forEach(passive=>{
    effects.push({id:`passive-${passive.id||passive.name}`,name:passive.name||'Passive',kind:'passive',type:passive.effectType||'passive',desc:passive.desc||'Passive effect.',fill:100,timed:false,color:effectColor('buff',passive.effectType||'passive')});
  });
  if(p.focus) effects.push({id:'focus',name:'Focus',kind:'buff',type:'buff',desc:'Next magic action deals more damage.',fill:100,timed:false,color:effectColor('buff','buff')});
  if(p.guarded) effects.push(timedEffect('guarded','Guarded','buff','guard','Reduced incoming damage this enemy action.',1,1));
  if(p.protect) effects.push(timedEffect('cover','Cover','buff','tank','WAR will take the covered single-target hit.',1,1));
  if(p.jump) effects.push(timedEffect('jump','Jump','buff','movement','Avoids attacks until landing after enemy action.',1,1));
  if(p.shield>0) effects.push(timedEffect('shield','Shield','buff','shield',`Blocks ${Math.round(p.shield)} damage before HP loss.`,p.shield,p.shieldMax||p.shield));
  if(p.counter>0) effects.push(timedEffect('counter','Counter','buff','damage',`Returns ${Math.round(p.counter)} damage after being hit.`,p.counter,p.counterMax||p.counter));
  if(p.regen>0) effects.push(timedEffect('regen','Regen','buff','regen',`Heals ${Math.round(p.regen)} at end of turn, then fades.`,p.regen,p.regenMax||p.regen));
  if((p.status||[]).includes('armorDown')) effects.push({id:'armorDown',name:'Armor Down',kind:'debuff',type:'defense',desc:'Takes more physical damage.',fill:100,timed:false,color:effectColor('debuff','defense')});
  if((p.status||[]).includes('poison')) effects.push(timedEffect('poison','Poison','debuff','damage','Takes damage at end of turn. Esuna removes it.',p.statusTurns?.poison||1,3));
  if((p.status||[]).includes('icePrison')) effects.push(timedEffect('icePrison','Ice Prison','debuff','movement','Cannot move. Cover or cleanse before follow-up hits.',p.statusTurns?.icePrison||1,2));
  return effects;
}

    return;
  }
  state.wave++;
  document.getElementById('game').classList.add('victory-walk','wipe-out');
  await wait(680);
  await transitionToNextBattle();
}
function showResultWindow(expGain,goldGain,equipment){
  const r=document.getElementById('resultWindow');
  r.innerHTML=`<b>Victory</b>EXP +${expGain} · Gold +${goldGain}<br>Equipment: ${equipment}`;
  r.style.display='block';
}
function hideResultWindow(){document.getElementById('resultWindow').style.display='none';}
async function transitionToNextBattle(){
  const game=document.getElementById('game');
  if(!game.className.includes('wipe-out')){
    game.classList.add('wipe-out');
    await wait(680);
  }
  hideResultWindow();
  setupWave();
  game.classList.remove('wipe-out','victory-walk','enemy-defeated');
  game.classList.add('wipe-in','battle-enter');
  await wait(760);
  game.classList.remove('wipe-in','battle-enter');
}
function setupWave(){ const w=currentRunWaves()[state.wave-1]; state.enemy={name:w.name,maxHp:w.hp,hp:w.hp,defense:w.defense||0,magicDefense:w.magicDefense||0,sprite:w.sprite,spriteWidth:w.spriteWidth,spriteHeight:w.spriteHeight,facing:'right',buff:0,weak:false,dot:0,intent:null,hazards:[],laserStep:0,charge:null}; state.turn=1; state.party.forEach((p,i)=>{p.pos=[...START_POSITIONS[i]]; p.selectedAction=null; p.dest=null; p.protect=null; p.guarded=false; p.shield=0; p.shieldMax=0; p.counter=0; p.counterMax=0; p.regen=0; p.regenMax=0; p.jump=false; clearStatuses(p);}); chooseIntent(); state.resolving=false; if(state.screen==='battle') startPlanningTimer(); render(); }
function gameOver(){showModal('Party Defeated',`EXP kept: ${state.exp}. Gold lost by half: ${Math.floor(state.gold/2)}.`,[['Restart',restart]]);}
function restart(){state.wave=1;state.turn=1;state.gold=0;state.exp=0;startNewRunWaves(); queueAutosave(); document.getElementById('game').classList.remove('victory-walk','wipe-out','wipe-in','battle-enter','enemy-defeated'); hideResultWindow(); state.party.forEach((p,i)=>{p.hp=p.maxHp;p.res=Math.floor(p.maxRes*.7);p.pos=[...START_POSITIONS[i]];p.selectedAction=null;p.dest=null;p.protect=null;p.guarded=false;p.shield=0;p.shieldMax=0;p.counter=0;p.counterMax=0;p.regen=0;p.regenMax=0;p.jump=false;p.status=[];p.focus=false;}); hideModal(); setupWave();}
function retreatRun(){
  state.runNonce++;
  stopTurnTimer();
  hideActionTooltip();
  hideResultWindow();
  document.getElementById('game').classList.remove('victory-walk','wipe-out','wipe-in','battle-enter','enemy-defeated');
  state.screen='lobby'; state.wave=1; state.turn=1; state.resolving=false; state.runWaves=null;
  state.party.forEach((p,i)=>{p.hp=p.maxHp;p.res=Math.floor(p.maxRes*.7);p.pos=[...START_POSITIONS[i]];p.selectedAction=null;p.dest=null;p.protect=null;p.guarded=false;p.shield=0;p.shieldMax=0;p.counter=0;p.counterMax=0;p.regen=0;p.regenMax=0;p.jump=false;p.status=[];p.focus=false;});
  hideModal();
  renderLobby();
  log(`Retreated safely. Kept ${state.gold} gold and ${state.exp} EXP.`);
}
function showModal(title,body,buttons){const o=document.getElementById('overlay'),m=document.getElementById('modal'); m.innerHTML=`<h2>${title}</h2><p>${body}</p>`; buttons.forEach(([txt,fn])=>{const b=document.createElement('button'); b.textContent=txt; b.onclick=fn; m.appendChild(b);}); o.style.display='flex';}
function hideModal(){document.getElementById('overlay').style.display='none'}
function applySoundSettings(){
  document.querySelectorAll('audio').forEach(a=>{a.volume=state.lobbyOptions.soundVolume/100; a.muted=!state.lobbyOptions.sound;});
}
function showOptionsModal(){
  const o=document.getElementById('overlay'),m=document.getElementById('modal');
  m.innerHTML=`<h2>Options</h2>
    <div class="option-row"><span>Volume</span><input id="soundVolume" type="range" min="0" max="100" step="5" value="${state.lobbyOptions.soundVolume}"><strong id="soundVolumeValue">${state.lobbyOptions.soundVolume}</strong></div>
    <button id="closeOptionsBtn">Close</button><button class="danger-btn" id="abandonRunBtn">Abandon</button>`;
  o.style.display='flex';
  const slider=document.getElementById('soundVolume');
  slider.oninput=()=>{state.lobbyOptions.soundVolume=Number(slider.value); document.getElementById('soundVolumeValue').textContent=slider.value; applySoundSettings(); queueAutosave();};
  document.getElementById('closeOptionsBtn').onclick=hideModal;
  document.getElementById('abandonRunBtn').onclick=confirmAbandonRun;
}
function confirmAbandonRun(){
  showModal('Abandon Run','Leave current run and return to lobby. Gold and EXP from this run are lost.',[
    ['Cancel',showOptionsModal],
    ['Abandon',abandonRun]
  ]);
  document.getElementById('modal').lastChild.classList.add('danger-btn');
}
function abandonRun(){
  state.runNonce++;
  stopTurnTimer();
  hideActionTooltip();
  hideResultWindow();
  document.getElementById('game').classList.remove('victory-walk','wipe-out','wipe-in','battle-enter','enemy-defeated');
  state.screen='lobby'; state.wave=1; state.turn=1; state.gold=0; state.exp=0; state.resolving=false; state.runWaves=null; queueAutosave();
  state.party.forEach((p,i)=>{p.hp=p.maxHp;p.res=Math.floor(p.maxRes*.7);p.pos=[...START_POSITIONS[i]];p.selectedAction=null;p.dest=null;p.protect=null;p.guarded=false;p.shield=0;p.shieldMax=0;p.counter=0;p.counterMax=0;p.regen=0;p.regenMax=0;p.jump=false;p.status=[];p.focus=false;});
  hideModal();
  setupWave();
  log('Run abandoned.');
}
document.getElementById('resolveBtn').onclick=resolveTurn;
document.getElementById('readyBtn').onclick=enterBattle;
document.getElementById('prevJobBtn').onclick=()=>rotateHumanJob(-1);
document.getElementById('nextJobBtn').onclick=()=>rotateHumanJob(1);
document.getElementById('optionBtn').onclick=showOptionsModal;
window.addEventListener('beforeunload',savePlayerData);
bindIntentTooltip();
async function initGame(){
  try{await loadGameData();}
  catch(err){ensureJobData(); ensureLobbyLoadouts(); state.party.forEach(p=>applyJobToSlot(p,p.job,true)); log('CSV load failed. Using fallback data.');}
  if(loadPlayerSave()) log('Autosave loaded.');
  saveReady=true;
  setupWave();
  applySoundSettings();
  log('Prototype loaded: movement + timing + range warnings.');
}
initGame();
</script>
</body>
</html>
